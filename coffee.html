<!DOCTYPE html>
<html>
<head>
    <title>Coffee Menu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Coffee Menu</h1>
</header>

<section id="menu">
    <h2>Available Coffees</h2>

    <div class="coffee-card">
        <div class="coffee-info">
            <h3>Americano</h3>
            <p>Price: $3.00</p>
        </div>
        <img src="assets/images/Americano.png" alt="Americano">
    </div>

    <div class="coffee-card">
        <div class="coffee-info">
            <h3>Cappuccino</h3>
            <p>Price: $4.00</p>
        </div>
        <img src="assets/images/Cappuccino.png" alt="Cappuccino">
    </div>

    <div class="coffee-card">
        <div class="coffee-info">
            <h3>Café Latte</h3>
            <p>Price: $4.50</p>
        </div>
        <img src="assets/images/Café Latte.png" alt="Café Latte">
    </div>

    <br>

    <a href="index.html">
        <button>Back to Main Menu</button>
    </a>
</section>

</body>
</html>
