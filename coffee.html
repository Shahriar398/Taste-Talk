<!DOCTYPE html>
<html>
<head>
    <title>Coffee Menu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Coffee Menu</h1>
</header>

<section id="menu">

            <p>Price: TK 60.00</p>
        </div>
        <img src="assets/images/Regular Cold Coffee.png" alt="Regular Cold Coffee">
    </div>

    <div class="coffee-card">
        <div class="coffee-info">
            <h3>Espresso</h3>
            <p>Price: TK 120.00</p>
        </div>

    <div class="coffee-card">
        <div class="coffee-info">
            <h3>Americano</h3>
            <p>Price: TK 130.00</p>
        </div>

    </div>

    <div class="coffee-card">
        <div class="coffee-info">
            <h3>Cappuccino</h3>
            <p>Price: TK 140.00</p>
        </div>

    <div class="coffee-card">
        <div class="coffee-info">
            <h3>Café Latte</h3>
            <p>Price: TK 150.00</p>

    <div class="coffee-card">
        <div class="coffee-info">
            <h3>Mocha</h3>
            <p>Price: TK 160.00</p>
        </div>

    </div>

    <a href="index.html">
        <button>Back to Main Menu</button>
    </a>
</section>

</body>
</html>
